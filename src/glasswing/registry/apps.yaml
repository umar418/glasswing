# Registry of AI apps Glasswing inspects. Add an app here; no code change needed.
#
# path         ~ = home, %APPDATA% = Windows roaming app data.
# mcp_key      dotted path to the MCP server definitions. "*" matches every key
#              at that level (e.g. projects.*.mcpServers). The value may be a
#              map of name -> server, or a list of servers with a "name" field.
# settings     which app-specific risk checks to run on this file.
# source       the vendor documentation the entry was checked against.
# Last verified against vendor docs: 2026-11-20.

- id: claude-desktop
  name: Claude Desktop
  source: https://modelcontextprotocol.io/docs/develop/connect-local-servers
  configs:
    - { os: macos, path: "~/Library/Application Support/Claude/claude_desktop_config.json", format: json, mcp_key: mcpServers }
    - { os: windows, path: "%APPDATA%/Claude/claude_desktop_config.json", format: json, mcp_key: mcpServers }
    - { os: linux, path: "~/.config/Claude/claude_desktop_config.json", format: json, mcp_key: mcpServers }

- id: claude-code
  name: Claude Code
  source: https://code.claude.com/docs/en/settings.md
  configs:
    - { os: any, path: "~/.claude.json", format: json, mcp_key: mcpServers }
    - { os: any, path: "~/.claude.json", format: json, mcp_key: "projects.*.mcpServers" }
    - { os: any, path: "~/.claude/settings.json", format: json, settings: claude-code }
    - { os: any, path: "~/.claude/settings.local.json", format: json, settings: claude-code }
    - { os: macos, path: "/Library/Application Support/ClaudeCode/managed-settings.json", format: json, settings: claude-code }
    - { os: linux, path: "/etc/claude-code/managed-settings.json", format: json, settings: claude-code }
    - { os: any, path: ".mcp.json", format: json, mcp_key: mcpServers, project_relative: true }
    - { os: any, path: ".claude/settings.json", format: json, settings: claude-code, project_relative: true }
    - { os: any, path: ".claude/settings.local.json", format: json, settings: claude-code, project_relative: true }

- id: cursor
  name: Cursor
  source: https://cursor.com/docs/context/mcp
  configs:
    - { os: any, path: "~/.cursor/mcp.json", format: json, mcp_key: mcpServers }
    - { os: any, path: ".cursor/mcp.json", format: json, mcp_key: mcpServers, project_relative: true }

- id: vscode
  name: VS Code (Copilot)
  source: https://code.visualstudio.com/docs/agents/reference/mcp-configuration
  configs:
    - { os: any, path: "~/.copilot/mcp-config.json", format: json, mcp_key: mcpServers }
    - { os: macos, path: "~/Library/Application Support/Code/User/mcp.json", format: json, mcp_key: servers }
    - { os: windows, path: "%APPDATA%/Code/User/mcp.json", format: json, mcp_key: servers }
    - { os: linux, path: "~/.config/Code/User/mcp.json", format: json, mcp_key: servers }
    - { os: any, path: ".vscode/mcp.json", format: json, mcp_key: servers, project_relative: true }

- id: windsurf
  name: Windsurf / Devin Desktop
  source: https://docs.devin.ai/windsurf/plugins/cascade/mcp
  configs:
    - { os: macos, path: "~/.config/devin/mcp_config.json", format: json, mcp_key: mcpServers }
    - { os: linux, path: "~/.config/devin/mcp_config.json", format: json, mcp_key: mcpServers }
    - { os: windows, path: "%APPDATA%/devin/mcp_config.json", format: json, mcp_key: mcpServers }
    - { os: any, path: "~/.codeium/windsurf/mcp_config.json", format: json, mcp_key: mcpServers }
    - { os: any, path: "~/.codeium/windsurf-next/mcp_config.json", format: json, mcp_key: mcpServers }
    - { os: any, path: ".devin/mcp_config.json", format: json, mcp_key: mcpServers, project_relative: true }
    - { os: any, path: ".devin/mcp_config.local.json", format: json, mcp_key: mcpServers, project_relative: true }

- id: gemini-cli
  name: Gemini CLI
  source: https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/mcp-server.md
  configs:
    - { os: any, path: "~/.gemini/settings.json", format: json, mcp_key: mcpServers }
    - { os: any, path: ".gemini/settings.json", format: json, mcp_key: mcpServers, project_relative: true }

- id: codex-cli
  name: Codex CLI
  source: https://learn.chatgpt.com/docs/config-file/config-reference
  configs:
    - { os: any, path: "~/.codex/config.toml", format: toml, mcp_key: mcp_servers, settings: codex }
    - { os: any, path: ".codex/config.toml", format: toml, mcp_key: mcp_servers, settings: codex, project_relative: true }

- id: continue
  name: Continue
  source: https://docs.continue.dev/customize/deep-dives/mcp
  configs:
    - { os: any, path: "~/.continue/config.yaml", format: yaml, mcp_key: mcpServers }
    - { os: any, path: "~/.continue/config.json", format: json, mcp_key: experimental.modelContextProtocolServers }
