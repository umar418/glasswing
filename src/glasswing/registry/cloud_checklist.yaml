# Connections that live on a provider's servers, which Glasswing cannot see
# from this computer. Shown as a manual checklist. Last checked: 2026-11-20.
# "url: null" means no stable direct link is documented; "where" says how to
# get there instead.
- provider: Google Account
  what: "Apps and services with access to your Google account"
  url: "https://myaccount.google.com/connections"
- provider: Microsoft Account
  what: "Apps and services with access to your Microsoft account"
  url: "https://account.live.com/consent/Manage"
- provider: GitHub
  what: "Authorized OAuth apps"
  url: "https://github.com/settings/applications"
- provider: GitHub
  what: "Installed GitHub Apps"
  url: "https://github.com/settings/installations"
- provider: Slack
  what: "Apps installed in your workspace"
  url: "https://slack.com/apps/manage"
- provider: Claude
  what: "Connectors (Gmail, Drive, calendars and other connected apps)"
  url: "https://claude.ai/customize/connectors"
- provider: ChatGPT
  what: "Connected apps (formerly called connectors)"
  url: null
  where: "In ChatGPT, open Settings and choose Apps."
- provider: Gemini
  what: "Connected apps"
  url: "https://gemini.google.com/apps"
