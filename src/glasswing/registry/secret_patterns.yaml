# Vendored secret-detection patterns. Keep conservative (favor missing a
# secret over flagging normal text) but cover the common vendor prefixes.
- id: anthropic-api-key
  name: Anthropic API key
  pattern: 'sk-ant-[A-Za-z0-9_-]{20,}'
- id: openai-api-key
  name: OpenAI API key
  pattern: 'sk-[A-Za-z0-9]{20,}'
- id: google-api-key
  name: Google API key
  pattern: 'AIza[0-9A-Za-z_-]{35}'
- id: aws-access-key-id
  name: AWS access key ID
  pattern: '(?:AKIA|ASIA)[0-9A-Z]{16}'
- id: github-token
  name: GitHub token
  pattern: 'gh[pousr]_[A-Za-z0-9]{36,}'
- id: slack-token
  name: Slack token
  pattern: 'xox[baprs]-[A-Za-z0-9-]{10,}'
- id: stripe-key
  name: Stripe API key
  pattern: '(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}'
- id: generic-bearer-assignment
  name: Generic token/secret assignment
  pattern: '(?i)(?:api[_-]?key|secret|token|password|passwd)["'']?\s*[:=]\s*["'']([A-Za-z0-9/_\-+=]{16,})["'']'
  group: 1
- id: generic-high-entropy
  name: Generic high-entropy string
  pattern: '[A-Za-z0-9+/_-]{40,}={0,2}'
  high_entropy_only: true
