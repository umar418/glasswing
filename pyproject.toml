[project]
name = "glasswing"
version = "0.2.0"
description = "Free, local-only scanner: see what you've given AI tools access to, what they've touched, and what to lock down."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Glasswing contributors" }]
dependencies = [
  "typer>=0.12,<1.0",
  "pyyaml>=6.0,<7.0",
  "jinja2>=3.1,<4.0",
  "rich>=13.0,<14.0",
  "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.scripts]
glasswing = "glasswing.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasswing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
